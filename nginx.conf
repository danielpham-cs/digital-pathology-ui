# Single entry point: routes / to the Next app and /api to the tile server.
# Same-origin for the browser (no CORS), and streams large slide uploads.
server {
    listen 80;

    client_max_body_size 0;          # no cap on slide upload size
    proxy_request_buffering off;      # stream the upload straight to the backend
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
