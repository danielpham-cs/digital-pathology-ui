# PathologyAI — one command to run the whole app (frontend + tile server).
#
#   docker compose up -d --build
#
# Then open http://localhost:3000 (same machine) or http://<server-LAN-IP>:3000
# (anyone on the lab network). Put slide files (.svs/.tiff/.ndpi) in ./slides.
#
# nginx is the single entry point (:3000): it routes / to the Next app and /api
# to the tile server — same-origin (no CORS) and streams large slide uploads.

services:
  backend:
    build: ./backend
    environment:
      SLIDES_DIR: /slides
    volumes:
      - ./slides:/slides
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
